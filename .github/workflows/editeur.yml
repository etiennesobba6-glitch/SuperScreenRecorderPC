name: Build Editeur

on:
  push:
    paths: ['editeur/**', '.github/workflows/editeur.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compiler 64 bits
        run: dotnet build editeur/win10/Editeur.csproj -c Release -o edi64

      - name: Compiler 32 bits Windows 7
        run: dotnet build editeur/win7/Editeur35.csproj -c Release -o edi32

      - name: ffmpeg 64 bits
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg64.zip
          Expand-Archive ffmpeg64.zip -DestinationPath ffx64
          $exe = Get-ChildItem -Path ffx64 -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $exe.FullName edi64\ffmpeg.exe
          Remove-Item edi64\*.pdb -ErrorAction SilentlyContinue

      - name: ffmpeg 32 bits
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://github.com/OKaluza/ffmpeg.zeranoe.com/raw/main/ffmpeg-4.3.1-win32-static.zip" -OutFile ffmpeg32.zip
          Expand-Archive ffmpeg32.zip -DestinationPath ffx32
          $exe = Get-ChildItem -Path ffx32 -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $exe.FullName edi32\ffmpeg.exe
          Remove-Item edi32\*.pdb -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        with:
          name: Editeur-PC
          path: edi64

      - uses: actions/upload-artifact@v4
        with:
          name: Editeur-PC-32bits
          path: edi32
